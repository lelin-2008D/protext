<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HISAB - Personal Money Tracker</title>

    <!-- Theme Initialization (Prevents flash of light/dark theme on page load) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('hisab_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (saved === 'system' && systemDark) || (!saved && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Meta Description & Theme -->
    <meta name="description" content="Simple personal money tracker for Nepal with natural language input" />
    <meta name="theme-color" content="#2563EB" />

    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HISAB" />
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* =========================
         PRELOADER
      ========================= */
      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background:
          radial-gradient(
            circle at center,
            rgba(37, 99, 235, .15),
            transparent 45%
          ),
          #050816;
        z-index: 99999;
        transition:
          opacity .8s ease,
          visibility .8s ease;
      }

      #preloader.hide {
        opacity: 0;
        visibility: hidden;
      }

      /* =========================
         MANDALA CORNERS
      ========================= */
      .mandala-corner {
        position: absolute;
        width: clamp(240px, 32vw, 360px);
        height: clamp(240px, 32vw, 360px);
        pointer-events: none;
        z-index: 1;
        opacity: 0.45;
        display: grid;
        place-items: center;
      }

      .mandala-tr {
        top: -60px;
        right: -60px;
      }

      .mandala-bl {
        bottom: -60px;
        left: -60px;
      }

      .mandala-main {
        position: relative;
        width: 100%;
        height: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 9999px;
        animation: mandalaSpin 45s linear infinite;
        background:
          repeating-conic-gradient(from 0deg, transparent 0deg 1.2deg, rgba(255,255,255,.22) 1.3deg 1.55deg, transparent 1.6deg 3deg),
          repeating-conic-gradient(from 0deg, transparent 0deg 7deg, rgba(255,255,255,.95) 7.1deg 7.8deg, transparent 8deg 15deg),
          radial-gradient(circle, transparent 0 12%, rgba(255,255,255,.95) 12.2% 12.6%, transparent 12.8% 18%, rgba(255,255,255,.55) 18.2% 18.5%, transparent 18.7% 25%, rgba(255,255,255,.95) 25.2% 25.6%, transparent 25.8% 32%, rgba(255,255,255,.55) 32.2% 32.5%, transparent 32.7% 40%, rgba(255,255,255,.95) 40.2% 40.6%, transparent 40.8% 48%, rgba(255,255,255,.55) 48.2% 48.5%, transparent 48.7% 57%, rgba(255,255,255,.95) 57.2% 57.6%, transparent 57.8% 67%, rgba(255,255,255,.55) 67.2% 67.5%, transparent 67.7% 77%, rgba(255,255,255,.95) 77.2% 77.7%, transparent 78% 100%);
        filter: drop-shadow(0 0 5px white) drop-shadow(0 0 18px rgba(255,255,255,.45));
      }

      .mandala-outer {
        position: absolute;
        inset: 3%;
        border-radius: 9999px;
        background:
          repeating-conic-gradient(from 7.5deg, transparent 0deg 14deg, rgba(255,255,255,.85) 14.2deg 15deg, transparent 15.2deg 30deg),
          repeating-conic-gradient(from 0deg, rgba(255,255,255,.25) 0deg .35deg, transparent .35deg 2deg);
        mask: radial-gradient(circle, transparent 0 62%, #000 62.2% 96%, transparent 96.2%);
        -webkit-mask: radial-gradient(circle, transparent 0 62%, #000 62.2% 96%, transparent 96.2%);
        animation: mandalaSpinReverse 35s linear infinite;
      }

      .mandala-flower {
        position: absolute;
        inset: 10%;
        border-radius: 9999px;
        background:
          repeating-conic-gradient(from 0deg, transparent 0deg 13deg, rgba(255,255,255,.9) 13.2deg 14.5deg, transparent 14.7deg 30deg),
          repeating-conic-gradient(from 7.5deg, transparent 0deg 7deg, rgba(255,255,255,.4) 7deg 7.8deg, transparent 8deg 15deg);
        mask: radial-gradient(circle, #000 0 66%, transparent 67%);
        -webkit-mask: radial-gradient(circle, #000 0 66%, transparent 67%);
        animation: mandalaSpin 28s linear infinite;
      }

      .mandala-center {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 22%;
        height: 22%;
        transform: translate(-50%, -50%);
        border-radius: 9999px;
        background:
          repeating-conic-gradient(from 0deg, white 0deg 4deg, transparent 4deg 15deg),
          radial-gradient(circle, white 0 5%, transparent 6% 20%, rgba(255,255,255,.9) 21% 23%, transparent 24% 39%, white 40% 42%, transparent 43%);
        box-shadow: 0 0 8px white, 0 0 20px white, 0 0 45px rgba(255,255,255,.6), 0 0 90px rgba(255,255,255,.25);
        animation: mandalaCenterPulse 4s ease-in-out infinite;
      }

      .mandala-center-ring {
        position: absolute;
        inset: -28%;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 0 0 7px rgba(255,255,255,.3), 0 0 0 15px rgba(255,255,255,.2);
        background: repeating-conic-gradient(from 0deg, transparent 0deg 8deg, rgba(255,255,255,.7) 8deg 9deg, transparent 9deg 16deg);
        mask: radial-gradient(circle, transparent 0 60%, #000 60.5%);
        -webkit-mask: radial-gradient(circle, transparent 0 60%, #000 60.5%);
      }

      .mandala-inner-diamond {
        position: absolute;
        inset: -70%;
        border-radius: 9999px;
        background: repeating-conic-gradient(from 0deg, transparent 0deg 14deg, rgba(255,255,255,.45) 14deg 15deg, transparent 15deg 30deg);
        mask: radial-gradient(circle, transparent 0 58%, #000 58.5% 64%, transparent 64.5%);
        -webkit-mask: radial-gradient(circle, transparent 0 58%, #000 58.5% 64%, transparent 64.5%);
      }

      @keyframes mandalaSpin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes mandalaSpinReverse {
        from {
          transform: rotate(360deg);
        }
        to {
          transform: rotate(0deg);
        }
      }

      @keyframes mandalaCenterPulse {
        0%, 100% {
          transform: translate(-50%, -50%) scale(1);
          filter: brightness(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.08);
          filter: brightness(1.5);
        }
      }

      /* =========================
         LOADER
      ========================= */
      #preloader .loader {
        position: relative;
        z-index: 2;
        width: 300px;
        text-align: center;
        user-select: none;
      }

      /* =========================
         LOGO
      ========================= */
      #preloader .logo {
        position: relative;
        width: 90px;
        height: 90px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 26px;
        background:
          linear-gradient(
            135deg,
            #2563eb,
            #3b82f6
          );
        box-shadow:
          0 0 50px rgba(37,99,235,.4);
        animation:
          logoEnter 1s
          cubic-bezier(.16,1,.3,1)
          forwards,
          logoFloat 3s
          ease-in-out
          1s
          infinite;
      }

      /* glowing background */
      #preloader .logo::before {
        content: "";
        position: absolute;
        inset: -15px;
        border-radius: 35px;
        background:
          rgba(37,99,235,.25);
        filter: blur(20px);
        z-index: -1;
        animation:
          glow 2s
          ease-in-out
          infinite;
      }

      /* rotating border */
      #preloader .logo::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 29px;
        background:
          conic-gradient(
            from 0deg,
            transparent,
            #60a5fa,
            white,
            transparent 35%,
            transparent
          );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation:
          rotateBorder 2s linear infinite;
      }

      /* H */
      #preloader .logo span {
        color: white;
        font-size: 38px;
        font-weight: 900;
        letter-spacing: -3px;
        animation:
          letterReveal .8s
          cubic-bezier(.16,1,.3,1)
          .25s
          both;
      }

      /* =========================
         BRAND
      ========================= */
      #preloader .brand {
        margin-top: 25px;
        color: white;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 7px;
        animation:
          textReveal .8s
          ease
          .4s
          both;
      }

      #preloader .tagline {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 11px;
        letter-spacing: 2px;
        animation:
          textReveal .8s
          ease
          .55s
          both;
      }

      /* =========================
         LOADING BAR
      ========================= */
      #preloader .progress {
        position: relative;
        width: 220px;
        height: 3px;
        margin: 32px auto 0;
        overflow: hidden;
        border-radius: 20px;
        background:
          rgba(255,255,255,.1);
      }

      #preloader .progress::after {
        content: "";
        position: absolute;
        top: 0;
        left: -50%;
        width: 50%;
        height: 100%;
        border-radius: inherit;
        background:
          linear-gradient(
            90deg,
            transparent,
            #60a5fa,
            white
          );
        animation:
          loading 1.2s
          ease-in-out
          infinite;
      }

      #preloader .status {
        margin-top: 15px;
        color: #64748b;
        font-size: 11px;
        letter-spacing: 1px;
        animation:
          pulse 1.5s
          ease-in-out
          infinite;
      }

      /* =========================
         ANIMATIONS
      ========================= */
      @keyframes logoEnter {
        0% {
          opacity: 0;
          transform: scale(.4) rotate(-25deg) translateY(30px);
        }
        60% {
          opacity: 1;
          transform: scale(1.1) rotate(5deg) translateY(-5px);
        }
        80% {
          transform: scale(.96) rotate(-2deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0) translateY(0);
        }
      }

      @keyframes letterReveal {
        0% {
          opacity: 0;
          transform: scale(.2) rotateY(90deg);
          filter: blur(10px);
        }
        70% {
          opacity: 1;
          transform: scale(1.15) rotateY(-10deg);
          filter: blur(0);
        }
        100% {
          transform: scale(1) rotateY(0);
        }
      }

      @keyframes textReveal {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes logoFloat {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes glow {
        0%, 100% {
          opacity: .3;
          transform: scale(.9);
        }
        50% {
          opacity: .8;
          transform: scale(1.1);
        }
      }

      @keyframes rotateBorder {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes loading {
        0% {
          left: -50%;
        }
        100% {
          left: 100%;
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: .4;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-[#0B0F19] text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen selection:bg-blue-500 selection:text-white pb-safe-bottom pt-safe-top">
    <!-- =========================
         HISAB PRELOADER
    ========================= -->
    <div id="preloader">
      <!-- Mandala Top Right -->
      <div class="mandala-corner mandala-tr">
        <div class="mandala-main">
          <div class="mandala-outer"></div>
          <div class="mandala-flower"></div>
          <div class="mandala-center">
            <div class="mandala-center-ring"></div>
            <div class="mandala-inner-diamond"></div>
          </div>
        </div>
      </div>

      <!-- Mandala Bottom Left -->
      <div class="mandala-corner mandala-bl">
        <div class="mandala-main">
          <div class="mandala-outer"></div>
          <div class="mandala-flower"></div>
          <div class="mandala-center">
            <div class="mandala-center-ring"></div>
            <div class="mandala-inner-diamond"></div>
          </div>
        </div>
      </div>

      <div class="loader">
        <!-- LOGO -->
        <div class="logo">
          <span>H</span>
        </div>

        <!-- BRAND -->
        <div class="brand">
          HISAB
        </div>

        <div class="tagline">
          PERSONAL MONEY TRACKER
        </div>

        <!-- LOADING -->
        <div class="progress"></div>

        <div class="status">
          Organizing your finances...
        </div>
      </div>
    </div>

    <script>
      (function() {
        function dismissPreloader() {
          var preloader = document.getElementById("preloader");
          if (!preloader || preloader.dataset.dismissed) return;
          preloader.dataset.dismissed = "true";
          setTimeout(function() {
            preloader.classList.add("hide");
            setTimeout(function() {
              if (preloader.parentNode) {
                preloader.remove();
              }
            }, 800);
          }, 2200);
        }

        if (document.readyState === "complete") {
          dismissPreloader();
        } else {
          window.addEventListener("load", dismissPreloader);
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
